<link href="../css/sub_mem.css" rel="stylesheet">
<link href="../css/sub.css" rel="stylesheet">
<div class="modal-header">
    <h2>로그인</h2>
    <button class="close-btn" onclick="closeModal()">&times;</button>
</div>
<form class="modal-form" action="loginService.do" method="post">
    <div class="input-group">
        <label for="login-id">아이디</label>
        <input type="text" id="login-id" name="userId" placeholder="아이디를 입력하세요" required>
    </div>
    <div class="input-group">
        <label for="login-pw">비밀번호</label>
        <input type="password" id="login-pw" name="userPw" placeholder="비밀번호를 입력하세요" required>
    </div>
    <button type="submit" class="submit-btn">로그인</button>
    <div class="modal-footer">
        <span>계정이 없으신가요? <a href="member/member_join.html" onclick="closeModal(); goPage('join');">회원가입</a></span>
    </div>
</form>
